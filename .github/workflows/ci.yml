name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell script line endings (must be LF)
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if grep -q $'\r' "$f"; then
              echo "CRLF detected: $f"
              bad=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          if (( bad != 0 )); then
            echo "Shell scripts must use LF line endings. Run: python scripts/dev/fix_line_endings.py --fix"
            exit 1
          fi

      - name: Run shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | \
            xargs -0 shellcheck -x -e SC1091,SC2034,SC2086,SC2155,SC2162

      - name: Syntax check all scripts
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | \
            while IFS= read -r -d '' f; do
              bash -n "$f" || exit 1
            done

      - name: Smoke test main entry
        run: |
          NETOOL_SKIP_LICENSE=1 bash main.sh --version
          NETOOL_SKIP_LICENSE=1 bash main.sh --list >/dev/null
          NETOOL_SKIP_LICENSE=1 bash main.sh check >/dev/null
